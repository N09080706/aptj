<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>auto_porsche_tj — Генератор объявления</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --border-color: #2e2e2e;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #d5001c; /* Фирменный красный Porsche */
            --accent-hover: #b00017;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        /* Форма */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            background-color: #242424;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 10px 14px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        /* Кнопка */
        .btn-submit {
            width: 100%;
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* Результат */
        .result-container {
            display: none;
            position: relative;
        }

        .result-box {
            background-color: #242424;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            line-height: 1.5;
            color: #e0e0e0;
            max-height: 350px;
            overflow-y: auto;
        }

        .btn-action {
            margin-top: 10px;
            width: 100%;
            background-color: #333;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #444;
        }

        .btn-action.success {
            background-color: #2e7d32;
            border-color: #2e7d32;
        }

        .flex-2 { flex: 2; }
        .flex-1 { flex: 1; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <h1>auto_porsche_tj</h1>
        </div>

        <!-- Форма заполнения -->
        <div class="card">
            <div class="form-group">
                <label>☎️ Телефон</label>
                <input type="number" id="phone" placeholder="Например: 999999999">
            </div>

            <div class="form-group">
                <label>🚘 Модель</label>
                <input type="text" id="model" placeholder="Например: Mersedes benz w124">
            </div>

            <div class="form-group">
                <label>📅 Год</label>
                <input type="number" id="year" placeholder="Например: 1994">
            </div>

            <div class="form-group">
                <label>🏁 Производство</label>
                <input type="text" id="madeIn" placeholder="Например: Германия">
            </div>

            <div class="form-group">
                <label>🐎 Пробег (км)</label>
                <input type="number" id="mileage" placeholder="Например: 12000">
            </div>

            <div class="form-group">
                <label>⚙️ Трансмиссия</label>
                <select id="transmission">
                    <option value="Механика" selected>Механика</option>
                    <option value="Автомат">Автомат</option>
                    <option value="Робот">Робот</option>
                </select>
            </div>

            <div class="form-group">
                <label>⛽️ Топливо</label>
                <select id="fuel">
                    <option value="Бензин">Бензин</option>
                    <option value="Бензин Газ" selected>Бензин Газ</option>
                    <option value="Дизель">Дизель</option>
                    <option value="Гибрид">Гибрид</option>
                    <option value="Электро">Электро</option>
                </select>
            </div>

            <div class="form-group">
                <label>🔋 Двигатель</label>
                <input type="number" step="0.1" id="engine" placeholder="Например: 2.0">
            </div>

            <div class="form-group">
                <label>💳 Техосмотр</label>
                <div class="input-row">
                    <input type="number" id="techNumber" class="flex-2" placeholder="Например: 7">
                    <select id="techUnit" class="flex-1">
                        <option value="Рӯз">Рӯз</option>
                        <option value="Моҳ" selected>Моҳ</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>🕶 Тонировка</label>
                <div class="input-row">
                    <select id="tintingStatus" class="flex-1" onchange="toggleTintingInput()">
                        <option value="Нест" selected>Нест</option>
                        <option value="Хаст">Хаст</option>
                    </select>
                    <input type="number" id="tintingNumber" class="flex-1" placeholder="Срок (например: 9)" style="display:none;">
                    <select id="tintingUnit" class="flex-1" style="display:none;">
                        <option value="Рӯз">Рӯз</option>
                        <option value="Моҳ" selected>Моҳ</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>♻️ Утилизация</label>
                <select id="utilization">
                    <option value="Хаст" selected>Хаст</option>
                    <option value="Нест">Нест</option>
                </select>
            </div>

            <div class="form-group">
                <label>🛠️ Состояние</label>
                <input type="text" id="condition" placeholder="Например: Идеально">
            </div>

            <div class="form-group">
                <label>💶 Цена (сомонӣ)</label>
                <input type="number" id="price" placeholder="Например: 45000">
            </div>

            <div class="form-group">
                <label>🔄 Бартер</label>
                <div class="input-row">
                    <select id="barterStatus" class="flex-1" onchange="toggleBarterInput()">
                        <option value="Не предусмотрен" selected>Не предусмотрен</option>
                        <option value="Возможен">Возможен</option>
                        <option value="Предусмотрен">Предусмотрен</option>
                    </select>
                    <input type="text" id="barterCar" class="flex-1" placeholder="На какое авто" style="display:none;">
                </div>
            </div>

            <button class="btn-submit" onclick="generatePost()">Применить</button>
        </div>

        <!-- Пространство показа результата -->
        <div class="card result-container" id="resultCard">
            <label>Сгенерированное объявление:</label>
            <div class="result-box" id="resultText"></div>
            <button class="btn-action" id="copyBtn" onclick="copyResult()">Скопировать</button>
            <button class="btn-action" id="tgBtn" onclick="sendToTelegram()">Отправить в телеграм</button>
        </div>
    </div>

    <script>
        function toggleTintingInput() {
            const status = document.getElementById('tintingStatus').value;
            const numInput = document.getElementById('tintingNumber');
            const unitSelect = document.getElementById('tintingUnit');
            
            if (status === 'Хаст') {
                numInput.style.display = 'block';
                unitSelect.style.display = 'block';
            } else {
                numInput.style.display = 'none';
                unitSelect.style.display = 'none';
                numInput.value = '';
            }
        }

        function toggleBarterInput() {
            const status = document.getElementById('barterStatus').value;
            const carInput = document.getElementById('barterCar');
            
            if (status === 'Предусмотрен') {
                carInput.style.display = 'block';
            } else {
                carInput.style.display = 'none';
                carInput.value = '';
            }
        }

        function generatePost() {
            const phone = document.getElementById('phone').value;
            const model = document.getElementById('model').value;
            const year = document.getElementById('year').value;
            const madeIn = document.getElementById('madeIn').value;
            const mileage = document.getElementById('mileage').value;
            const transmission = document.getElementById('transmission').value;
            const fuel = document.getElementById('fuel').value;
            const engine = document.getElementById('engine').value;
            
            const techNumber = document.getElementById('techNumber').value;
            const techUnit = document.getElementById('techUnit').value;
            
            const tintingStatus = document.getElementById('tintingStatus').value;
            const tintingNumber = document.getElementById('tintingNumber').value;
            const tintingUnit = document.getElementById('tintingUnit').value;
            
            const utilization = document.getElementById('utilization').value;
            const condition = document.getElementById('condition').value;
            const price = document.getElementById('price').value;
            
            const barterStatus = document.getElementById('barterStatus').value;
            const barterCar = document.getElementById('barterCar').value;

            let tintingStr = "Нест";
            if (tintingStatus === 'Хаст' && tintingNumber) {
                tintingStr = `${tintingNumber} ${tintingUnit}`;
            }

            let barterStr = barterStatus;
            if (barterStatus === 'Предусмотрен' && barterCar) {
                barterStr = `Предусмотрен (${barterCar})`;
            }

            let result = "";
            if (phone) result += `☎️ Телефон: ${phone}\n\n`;
            if (model) result += `🚘 Модель: ${model}\n`;
            if (year) result += `📅 Год: ${year}\n`;
            if (madeIn) result += `🏁 Производство: ${madeIn}\n`;
            if (mileage) result += `🐎 Пробег: ${mileage} км\n`;
            if (transmission) result += `⚙️ Трансмиссия: ${transmission}\n`;
            if (fuel) result += `⛽️ Топливо: ${fuel}\n`;
            if (engine) result += `🔋 Двигатель: ${engine}\n`;
            if (techNumber) result += `💳 Техосмотр: ${techNumber} ${techUnit}\n`;
            result += `🕶 Тонировка: ${tintingStr}\n`;
            if (utilization) result += `♻️ Утилизация: ${utilization}\n`;
            if (condition) result += `🛠️ Состояние: ${condition}\n`;
            if (price) result += `💶 Цена: ${price} сомонӣ\n`;
            if (barterStr) result += `🔄 Бартер: ${barterStr}`;

            document.getElementById('resultText').innerText = result;
            document.getElementById('resultCard').style.display = 'block';
            document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
        }

        function copyResult() {
            const text = document.getElementById('resultText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = 'Скопировано! ✓';
                copyBtn.classList.add('success');
                
                setTimeout(() => {
                    copyBtn.textContent = 'Скопировать';
                    copyBtn.classList.remove('success');
                }, 2000);
            });
        }

        function sendToTelegram() {
            const text = document.getElementById('resultText').innerText;
            
            // ЗАМЕНИТЕ ЭТИ ДАННЫЕ СВОИМИ:
            const botToken = "8944753021:AAFJlj0E7CU5V827md4prUVoIOP95AlIaOs"; 
            const adminId = "6011486698";

            if (botToken === "YOUR_BOT_TOKEN" || adminId === "YOUR_ADMIN_CHAT_ID") {
                alert("Пожалуйста, укажите ваш Bot Token и Admin Chat ID в коде скрипта!");
                return;
            }

            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
            const tgBtn = document.getElementById('tgBtn');

            tgBtn.textContent = 'Отправка...';
            tgBtn.disabled = true;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: adminId,
                    text: text
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    tgBtn.textContent = 'Отправлено в Telegram! ✓';
                    tgBtn.classList.add('success');
                } else {
                    alert("Ошибка отправки: " + (data.description || 'Неизвестная ошибка'));
                    tgBtn.textContent = 'Отправить в телеграм';
                }
                
                setTimeout(() => {
                    tgBtn.textContent = 'Отправить в телеграм';
                    tgBtn.classList.remove('success');
                    tgBtn.disabled = false;
                }, 2500);
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Ошибка сети при отправке.");
                tgBtn.textContent = 'Отправить в телеграм';
                tgBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
